name: SonarCloud Analysis

"on":
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  sonarcloud:
    if: ${{ !github.event.repository.private }}
    name: SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0  # Full history for SonarCloud blame

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install -e . 2>/dev/null \
              || pip install -e ".[dev]" 2>/dev/null \
              || pip install -e ".[test]" 2>/dev/null \
              || true
          fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt || true; fi
          pip install pytest pytest-cov

      # Looked for tests/ at the repository root only. Every test in this repo
      # lives under plugins/, so has_tests was always false and the step below
      # never ran: 45 tests, including the outbound-mail and auth-guard ones,
      # had never gated a merge. Search where they actually are.
      - name: Check for tests
        id: check-tests
        run: |
          COUNT=$(find . -type d \( -name tests -o -name test -o -name __tests__ \) \
                    -not -path "*/node_modules/*" -not -path "./.git/*" | wc -l | tr -d ' ')
          if [ "$COUNT" -gt 0 ]; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
            echo "::notice::found $COUNT test director(ies)"
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
            echo "::notice::no test directories found — SonarCloud will scan without coverage"
          fi

      # A failing test now fails the job. This step previously carried
      # continue-on-error AND `|| true` AND an if-guard that was never true, so
      # it could not go red under any circumstance. Three independent mufflers on
      # a check whose only purpose is to make noise.
      - name: Run tests with coverage
        if: steps.check-tests.outputs.has_tests == 'true'
        run: pytest plugins --cov=plugins --cov-report=xml --cov-report=term-missing

      - name: Check for SonarCloud token
        id: check-sonar
        run: |
          if [ -n "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::notice::SONAR_TOKEN not configured — skipping SonarCloud scan"
          fi

      - name: SonarCloud Scan
        if: steps.check-sonar.outputs.has_token == 'true'
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8  # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
