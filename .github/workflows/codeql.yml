name: CodeQL

"on":
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # Keep init and analyze pinned to the SAME codeql-action version.
      # A split fails the run with "Loaded a configuration file for version X,
      # but running version Y". Dependabot groups these under "codeql-action"
      # so they always move together.
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with:
          languages: ${{ matrix.language }}
          # plugins/*/mcp-server/bundle/server.mjs is a ~580 KB esbuild output:
          # generated, reviewed as a diff of its SOURCE, and rebuilt byte for
          # byte by the bundle-drift job in lint.yml. Analysing it reports the
          # vendored SDK's code as this repo's, and a finding there cannot be
          # fixed here anyway. This is a `config:` on init, NOT a trigger-level
          # paths-ignore: paths-ignore under `on.push` would only decide whether
          # the workflow RUNS, so a PR touching only the bundle would skip
          # CodeQL on everything else too, which is worse than not excluding it.
          config: |
            paths-ignore:
              - "plugins/mail/mcp-server/bundle/**"
              - "plugins/chat/mcp-server/bundle/**"
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
