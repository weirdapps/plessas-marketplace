name: Validate Plugins

"on":
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate marketplace.json
        run: |
          if [ ! -f ".claude-plugin/marketplace.json" ]; then
            echo "marketplace.json not found"
            exit 1
          fi
          echo "marketplace.json found"
          cat .claude-plugin/marketplace.json | python3 -m json.tool > /dev/null
          echo "marketplace.json is valid JSON"

      - name: Validate plugin manifests
        run: |
          for dir in plugins/*/; do
            if [ -d "$dir" ] && [[ "$(basename "$dir")" != _* ]]; then
              plugin_json="${dir}.claude-plugin/plugin.json"
              if [ ! -f "$plugin_json" ]; then
                echo "Missing .claude-plugin/plugin.json in $dir"
                exit 1
              fi
              echo "Validating $plugin_json"
              cat "$plugin_json" | python3 -m json.tool > /dev/null
              for field in name description version; do
                if ! python3 -c "import json; d=json.load(open('$plugin_json')); assert '$field' in d" 2>/dev/null; then
                  echo "Missing required field '$field' in $plugin_json"
                  exit 1
                fi
              done
            fi
          done
          echo "All plugin manifests valid"

      - name: Validate README files exist
        run: |
          errors=0
          if [ ! -f "README.md" ]; then
            echo "Missing: README.md"
            errors=$((errors + 1))
          fi
          for dir in plugins/*/; do
            if [ -d "$dir" ] && [[ "$(basename "$dir")" != _* ]]; then
              if [ ! -f "${dir}README.md" ]; then
                echo "Missing: ${dir}README.md"
                errors=$((errors + 1))
              fi
            fi
          done
          [ $errors -eq 0 ] && echo "All READMEs present" || exit 1

      - name: Validate command frontmatter
        run: |
          errors=0
          for cmd_file in plugins/*/commands/*.md; do
            if [ -f "$cmd_file" ]; then
              if ! head -1 "$cmd_file" | grep -q "^---$"; then
                echo "$cmd_file missing frontmatter"
                errors=$((errors + 1))
              fi
            fi
          done
          [ $errors -eq 0 ] && echo "All command files have frontmatter" || exit 1

      - name: Validate skill frontmatter
        run: |
          errors=0
          for skill_file in plugins/*/skills/*/SKILL.md; do
            [ -f "$skill_file" ] || continue
            if ! head -1 "$skill_file" | grep -q "^---$"; then
              echo "$skill_file: missing frontmatter"
              errors=$((errors + 1))
              continue
            fi
            awk_prog='/^---$/{n++; next} n==1 && /^description:/{sub(/^description:[ ]*/,""); print; exit}'
            desc=$(awk "$awk_prog" "$skill_file")
            if [ -z "$desc" ]; then
              echo "$skill_file: missing description"
              errors=$((errors + 1))
              continue
            fi
            # Three weak structural floors. They exist to stop a future edit
            # regressing to a short description that never fires. Do NOT grow
            # them into rules about which phrases a description contains:
            # enumerating phrases is the failure mode this design rejects.
            if [ "${#desc}" -lt 400 ]; then
              echo "$skill_file: description is ${#desc} chars, minimum 400"
              errors=$((errors + 1))
            fi
            if ! printf '%s' "$desc" | grep -qE '[α-ωΑ-Ω]'; then
              echo "$skill_file: description has no Greek-script text"
              errors=$((errors + 1))
            fi
            if ! printf '%s' "$desc" | grep -q 'Do NOT use'; then
              echo "$skill_file: description has no negative boundary"
              errors=$((errors + 1))
            fi
          done
          [ $errors -eq 0 ] && echo "All skill files validated" || exit 1

      - name: Consistency checks
        run: python3 scripts/validate_consistency.py --verbose

      - name: Summary
        run: echo "All validation checks passed"
