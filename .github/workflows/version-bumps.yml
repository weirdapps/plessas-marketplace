name: Version Bumps

# Claude Code runs an installed plugin from a copy keyed on its plugin.json
# `version`, and `/plugin update` re-copies only when that version changes. So
# a change under plugins/<name>/ that leaves the version alone never reaches
# anyone who has the plugin installed. Between 2.2.0 and 2.2.1 that stranded
# two weeks of plugin changes, the rebuilt MCP bundles and the meetings router
# fixes among them, while every other check here was green. This fails them.
# The logic and its tests are in scripts/check_version_bumps.py.

"on":
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  version-bumps:
    name: changed plugins raise their version
    runs-on: ubuntu-latest
    env:
      # pull_request: the base branch tip. GITHUB_SHA is then the merge commit,
      # so BASE..HEAD is exactly what the PR would land. push: the previous tip.
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # Only the two trees are compared, so the history between them is not needed.
      - name: Fetch the base commit
        run: git fetch --no-tags --depth=1 origin "$BASE"

      - name: Check changed plugins raised their version
        run: python3 scripts/check_version_bumps.py "$BASE" HEAD
