sonar.organization=weirdapps
sonar.projectKey=weirdapps_plessas-marketplace
sonar.projectName=plessas-marketplace

sonar.sources=.
sonar.sourceEncoding=UTF-8

sonar.python.version=3.11

sonar.python.coverage.reportPaths=coverage.xml

sonar.exclusions=\
  **/tests/**,\
  **/.venv/**,\
  **/venv/**,\
  **/node_modules/**,\
  **/__pycache__/**,\
  **/.pytest_cache/**,\
  **/*.egg-info/**,\
  **/dist/**,\
  **/build/**,\
  **/bundled/**,\
  **/mcp-server/dist/**

sonar.test.exclusions=\
  **/tests/**,\
  **/*_test.py,\
  **/test_*.py
