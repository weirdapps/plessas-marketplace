sonar.organization=weirdapps
sonar.projectKey=weirdapps_plessas-marketplace
sonar.projectName=plessas-marketplace

sonar.sources=.
sonar.sourceEncoding=UTF-8

# 3.12, not 3.11. pyproject.toml pins ruff target-version = "py312" and mypy
# python_version = "3.12", and both CI workflows set up 3.12, because
# numpy >= 2.5.1 is itself `requires-python >=3.12`. Declaring 3.11 here made
# Sonar analyse the Python under a language version the code never runs on.
sonar.python.version=3.12

sonar.python.coverage.reportPaths=coverage.xml

# `**/bundled/**` used to sit in this list, between **/build/** and
# **/mcp-server/dist/**, and it was boilerplate that caught a first-party
# directory by name. plugins/decks/bundled/creative/ is not vendored from a
# live upstream: creative-toolkit was absorbed into decks during the
# communications-marketplace migration and is maintained here. The exclusion
# hid exactly one analysable file, iphone_mockup.py (260 lines), whose own
# test suite runs under `pytest plugins` and whose coverage was therefore
# measured into coverage.xml and then discarded by Sonar. The rest of that
# tree is 6 PNGs, 1 txt and 6 markdown files (1434 lines) that Sonar has no
# ruleset for. test_iphone_mockup.py stays out via sonar.test.exclusions.
sonar.exclusions=\
  **/tests/**,\
  **/.venv/**,\
  **/venv/**,\
  **/node_modules/**,\
  **/__pycache__/**,\
  **/.pytest_cache/**,\
  **/*.egg-info/**,\
  **/dist/**,\
  **/build/**,\
  **/mcp-server/dist/**

sonar.test.exclusions=\
  **/tests/**,\
  **/*_test.py,\
  **/test_*.py
