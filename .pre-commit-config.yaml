# Pre-commit hooks for Python projects
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']  # Allow custom YAML tags in GitHub Actions
      - id: check-json
        # tsconfig files are JSONC, not JSON: TypeScript has always accepted
        # `//` comments there and the compiler documents it. check-json is a
        # strict JSON parser, so it fails them at line 1 column 0. Both
        # tsconfig.test.json files open with a comment explaining why the file
        # exists at all, which is worth more than satisfying a parser that was
        # never meant to read them. The base tsconfig.json files happen to be
        # comment-free and would pass either way; this covers any future one.
        exclude: (^|/)tsconfig.*\.json$
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: check-added-large-files
        # 2000 KB accommodates official brand reference PDFs and high-res
        # product screenshots in plugins/decks/assets/. Anything genuinely
        # larger than this should be reviewed by hand before being added.
        args: ['--maxkb=2000']

  # Ruff - replaces black, isort, flake8
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # MyPy - type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --show-error-codes]
        additional_dependencies: [types-requests, types-PyYAML]

  # Gitleaks - secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # YAML linting for GitHub Actions
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [--strict, -d, '{extends: default, rules: {line-length: {max: 120}, document-start: disable}}']
        files: \.github/workflows/.*\.ya?ml$

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.yaml]
        # Plugin-internal docs (agent system prompts, command/skill specs,
        # bundled tools, MCP servers) are loose markdown by design — they
        # mix prose, code fences, and YAML frontmatter for LLM consumption.
        # Lint only top-level docs and per-plugin READMEs.
        #
        # shared/brand-system/ is the second half of that same rule. It is not
        # hand-written: scripts/sync_brand_system.sh copies it verbatim from
        # plugins/decks/shared/brand-system/, which the first clause already
        # exempts. Linting the mirror but not its source put two guards in
        # direct conflict. markdownlint wanted a blank line added to
        # shared/brand-system/generation-methods.md:260 (MD032), and the moment
        # anyone added it the no-drift guard (validate_consistency.py's
        # check_brand_system_sync) would fail on the resulting difference.
        # Fix a generated file at its source or not at all.
        exclude: ^(plugins/[^/]+/(agents|commands|skills|shared|bundled|tools|mcp-server)|shared/brand-system)/
