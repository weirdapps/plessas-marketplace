# Tooling-only config — no [project] or [build-system] section.
# Provides consistent lint/type-check settings for Python code
# scattered across plugins (decks/, scripts/, etc.).
#
# Python floor is 3.12, set by the dependency floors the tools declare:
# numpy >= 2.5.1 (nbg-keynote, device-mockup) is itself `requires-python >=3.12`.
# Keep target-version and python_version in step with that floor: mypy pinned to
# 3.11 cannot even parse numpy 2.5's stubs, which use PEP 695 `type` statements.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports OK in __init__.py
"tests/**/*.py" = ["B", "E"]  # relax rules for tests
"**/test_*.py" = ["B", "E"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start permissive, tighten later
check_untyped_defs = true
strict_optional = true
ignore_missing_imports = true
show_error_codes = true
