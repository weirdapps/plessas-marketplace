# The slide types nbg_build.py renders, what each is for, and the legacy names it
# still accepts.
#
# Readers:
#   tools/nbg-presentation/nbg_spec.py   normalises every alias below to its canonical
#                                        name, with a warning naming the replacement,
#                                        and suggests the closest name for a typo
#   agents (storyboard-designer)         pick a slide type by what the slide must say
#   tests                                assert these names equal deck.schema.json's
#
# Canonical names are the only ones a new spec should use. The deck spec itself is
# tools/nbg-presentation/deck.schema.json; this file does not restate its fields.

version: 2

slide_types:
  cover:
    use_for: "Opening slide: the deck title, the presenting unit, location and date."
    aliases: [covers, title_slide]
  contents:
    use_for: "A quiet wayfinder listing the sections (Standard #18). 2 to 6 rows with teasers, up to 8 without."
    aliases: [toc, agenda, table_of_contents]
  divider:
    use_for: "Section break: a two-digit number and the section title on one baseline (Standard #3)."
    aliases: [dividers, section, section_divider]
  content:
    use_for: "An action title over up to 8 bullets; the default when the message is an argument."
    aliases: [text, bullets, summary, text_only, text_with_bullets, contact]
  chart:
    use_for: "One native chart carries the message: comparison, trend, composition, share."
    aliases: []
  waterfall:
    use_for: "A bridge from one total to another through signed contributions."
    aliases: [waterfall_chart]
  table:
    use_for: "Exact figures a reader will look up, up to 14 rows."
    aliases: [tables, comparison_table]
  kpi:
    use_for: "Here are the headline numbers: 1 to 4 stat tiles, each a value, a label and an optional delta."
    aliases: [kpis, kpi_dashboard, key_figures, metrics]
  cards:
    use_for: "Here are the alternatives or the parallel ideas: 2 to 6 cards, one of which may be the recommended pick."
    aliases: [infographic, infographics, numbered_infographic, icons, icons_grid]
  process:
    use_for: "A journey or a sequence: 2 to 6 steps left to right with arrows between them."
    aliases: [timeline, process_flow, process_horizontal, steps, funnel]
  two_column:
    use_for: "Two blocks side by side: text arguing over a chart, or two comparable halves."
    aliases: [two_col, split]
  image:
    use_for: "A picture, screenshot, infographic or mockup, PNG, JPEG or SVG, with alt text."
    aliases: [picture, photo, screenshot]
  custom:
    use_for: "The escape hatch: positioned elements for a layout no named type covers. Still branded and validated."
    aliases: []
  back_cover:
    use_for: "The closing slide: the centred oval emblem and nothing else (Standard #19)."
    aliases: [back_covers, thankyou, thank_you, closing]

chart_types:
  bar:
    use_for: "Comparisons and rankings across categories (vertical columns)."
    aliases: [column, column_clustered, clustered, bar_single, bar_dual, comparison, combo_chart]
  bar_stacked:
    use_for: "Composition across categories or periods, 3 to 4 series at most."
    aliases: [stacked, stacked_bar, stacked_column, column_stacked]
  bar_horizontal:
    use_for: "Rankings with long category names, read top to bottom."
    aliases: [horizontal_bar, bar_h, barh]
  line:
    use_for: "Several overlapping trends where an area fill would mislead."
    aliases: [line_markers, line_single, line_with_text]
  area_line:
    use_for: "A time series (Standard #2.8): a line with hollow markers over a 15% fill."
    aliases: [area, area_chart, arealine]
  doughnut:
    use_for: "Part-to-whole with up to 6 slices. There is no pie: a pie becomes a doughnut."
    aliases: [pie, donut, pie_single, pie_with_text]

# Old slide types and storyline `recommended_visual` values that name a chart. The
# slide becomes `type: chart` (or `waterfall`) with this chart.type.
visual_aliases:
  bar_chart: bar
  column_chart: bar
  comparison_chart: bar
  stacked_bar_chart: bar_stacked
  stacked_column_chart: bar_stacked
  horizontal_bar_chart: bar_horizontal
  line_chart: line
  area_chart: area_line
  pie_chart: doughnut
  doughnut_chart: doughnut
  donut_chart: doughnut
  waterfall_chart: waterfall

# Old catalog paths ("covers/quiet", "charts/pie_single") keep working: the part
# before the slash picks the slide type, and for charts/ and infographics/ the part
# after it picks the chart type or the process layout.
path_prefixes:
  covers: cover
  dividers: divider
  content: content
  contact: content
  tables: table
  back_covers: back_cover
  infographics: cards
  charts: chart
