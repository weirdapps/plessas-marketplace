# Quarterly report: a longer review with sections, exhibits and a bridge.
# Exercises: cover, contents, divider, content (bullets with a takeaway),
# chart (area_line, bar_stacked, doughnut, and a four-bank comparison that the
# builder brands with each bank's colour and logo), table, waterfall, back_cover.
# The figures and sources are synthetic, written to show the shape.

presentation:
  title: "Quarterly Business Review"
  audience: "Executive Committee"
  purpose: "Q4 2025 performance review"
  main_recommendation: "Fee income grew in every line; keep the 2026 priorities unchanged"
  language: en

slides:
  - type: cover
    id: S01
    content:
      title: "Quarterly Business Review"
      subtitle: "Payments and Digital Channels | Q4 2025"
      location: "Athens"
      date: "January 2026"

  - type: contents
    id: S02
    content:
      sections:
        - title: "Card business performance"
          description: "Volumes, fees and the drivers behind them"
        - title: "Digital channels"
          description: "Adoption by segment and channel mix"
        - title: "Priorities for 2026"
          description: "What we will do next, and what we need"

  - type: divider
    id: S03
    content:
      number: 1
      title: "Card business performance"

  - type: content
    id: S04
    content:
      title: "Card spending grew 18% in 2025 and reached EUR 12.5B in the fourth quarter"
      bumper: "Cards overview"
      points:
        - "Cards in issue reached 5.2M, up 3% on the year"
        - "Active cards reached 3.8M, a 73% activation rate"
        - "Point-of-sale spending grew 22% to EUR 8.2B"
        - text: "Contactless payments were 91% of in-store transactions"
          level: 2
        - "Online card spending grew 35% to EUR 4.3B"
      takeaway: "Growth came from usage per card, not from new cards"

  - type: chart
    id: S05
    content:
      title: "Monthly card spending rose above the prior year in every month"
      description: "Card spending, EUR billions"
      source:
        name: "Card management information"
        as_of: "31 December 2025"
        basis: "cleared transactions, excludes cash advances"
    chart:
      type: area_line
      data:
        categories: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"]
        series:
          - name: "2024"
            values: [3.2, 3.1, 3.3, 3.5, 3.6, 3.8, 3.7, 3.9, 4.0, 4.2, 4.4, 4.8]
          - name: "2025"
            values: [3.8, 3.7, 4.0, 4.2, 4.3, 4.5, 4.4, 4.6, 4.8, 5.0, 5.3, 5.8]
      number_format: "0.0"

  - type: table
    id: S06
    content:
      title: "Net fee income from cards grew 18% with every line contributing"
      source:
        name: "Management accounts"
        as_of: "31 December 2025"
        basis: "constant scope"
    table:
      headers: ["Fee line", "Q4 2024", "Q4 2025", "Change"]
      rows:
        - ["Interchange", "EUR 42M", "EUR 48M", "+14%"]
        - ["Annual fees", "EUR 18M", "EUR 21M", "+17%"]
        - ["Foreign exchange", "EUR 8M", "EUR 11M", "+38%"]
        - ["Total net fee income", "EUR 68M", "EUR 80M", "+18%"]
      highlight_column: 3

  - type: waterfall
    id: S07
    content:
      title: "Interchange and foreign exchange explain most of the EUR 12M rise"
      description: "Net fee income bridge, Q4 2024 to Q4 2025, EUR millions"
      source:
        name: "Management accounts"
        as_of: "31 December 2025"
    chart:
      type: waterfall
      data:
        items:
          - {label: "Q4 2024", value: 68}
          - {label: "Interchange", value: 6}
          - {label: "Annual fees", value: 3}
          - {label: "Foreign exchange", value: 3}
          - {label: "Q4 2025", value: 80}

  - type: divider
    id: S08
    content:
      number: 2
      title: "Digital channels"

  - type: chart
    id: S09
    content:
      title: "Mobile now carries the largest share of transactions in every segment"
      description: "Share of transactions by channel, Q4 2025, %"
      source:
        name: "Channel management information"
        as_of: "31 December 2025"
    chart:
      type: bar_stacked
      data:
        categories: ["Retail", "Affluent", "Business"]
        series:
          - name: "Mobile"
            values: [58, 61, 42]
          - name: "Internet banking"
            values: [20, 24, 30]
          - name: "Branch and ATM"
            values: [22, 15, 28]

  - type: chart
    id: S10
    content:
      title: "Mobile and internet banking handle four in five transactions"
      description: "Transaction mix by channel, Q4 2025"
      source:
        name: "Channel management information"
        as_of: "31 December 2025"
    chart:
      type: doughnut
      data:
        categories: ["Mobile", "Internet banking", "ATM", "Branch"]
        series:
          - name: "Transactions"
            values: [0.56, 0.24, 0.13, 0.07]

  - type: chart
    id: S11
    content:
      title: "Our mobile share of transactions leads the four systemic banks"
      description: "Share of transactions made in the mobile app, Q4 2025, %"
      source:
        name: "Illustrative figures, not published data"
        as_of: "31 December 2025"
    chart:
      type: bar
      data:
        categories: ["NBG", "Eurobank", "Piraeus Bank", "Alpha Bank"]
        series:
          - name: "Mobile share"
            values: [58, 52, 49, 46]
      number_format: "0"

  - type: content
    id: S12
    content:
      title: "2026 priorities focus on mobile expansion and personalisation"
      bumper: "Priorities"
      points:
        - "Launch the business mobile app in the second quarter"
        - "Extend personalised offers to card products"
        - "Issue every new card as contactless"
        - "Reach an 85% digital share of transactions by year end"

  - type: back_cover
