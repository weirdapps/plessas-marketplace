# Executive summary: a short board deck led by the headline numbers.
# Exercises: cover, kpi, chart (bar with a highlighted category), cards (with SVG
# icons and one recommended option), two_column (bullets beside an area_line chart),
# back_cover. The figures and sources are synthetic, written to show the shape.

presentation:
  title: "Digital Banking Performance"
  audience: "Board of Directors"
  purpose: "Quarterly results review and one decision"
  main_recommendation: "Digital adoption beat every target; accelerate mobile-first investment"
  language: en

slides:
  - type: cover
    id: S01
    content:
      title: "Digital Banking Performance"
      subtitle: "Retail Banking | Q4 2025 review"
      location: "Athens"
      date: "February 2026"

  - type: kpi
    id: S02
    key_message: "Digital channels beat all three 2025 targets"
    content:
      title: "Digital channels beat all three of their 2025 targets"
      bumper: "Key finding"
      source:
        name: "Management information"
        as_of: "31 December 2025"
    kpis:
      - value: "2.8M"
        label: "Mobile active users"
        delta: "+23% year on year"
        sentiment: positive
      - value: "78%"
        label: "Transactions made in digital channels"
        delta: "+6 pts"
        sentiment: positive
      - value: "+45"
        label: "Net Promoter Score, digital customers"
        delta: "+12 pts"
        sentiment: positive
    notes: "Open with the three numbers; each beat its target by a clear margin."

  - type: chart
    id: S03
    content:
      title: "Mobile adoption grew fastest among the systemic banks in 2025"
      description: "Mobile active users, Q4 2025"
      source:
        name: "Management information and published peer reports"
        as_of: "31 December 2025"
        basis: "90-day active definition"
    chart:
      type: bar
      data:
        categories: ["Our bank", "Peer A", "Peer B", "Peer C"]
        series:
          - name: "Q4 2025"
            values: [2.8, 2.4, 2.2, 1.9]
      number_format: "0.0"
      unit: "millions"
      highlight_category: "Our bank"

  - type: cards
    id: S04
    content:
      title: "Three initiatives drove the result, and one should now scale"
      bumper: "Success factors"
      takeaway: "Scaling personalisation is the highest-return next step"
    cards:
      - title: "New mobile experience"
        body: "The redesigned app, live since Q2, raised session length by 40%."
        icon: "icons/mobile.svg"
      - title: "Instant payments"
        body: "Instant transfers in the app took 35% of person-to-person payments."
        icon: "icons/instant-payment.svg"
      - title: "Personalised offers"
        body: "Offers matched to spending patterns lifted conversion by 25%."
        icon: "icons/insight.svg"
        recommended: true

  - type: two_column
    id: S05
    split: "40/60"
    content:
      title: "We recommend accelerating mobile-first investment in 2026"
      bumper: "Recommendation"
      source:
        name: "Management information"
        as_of: "31 December 2025"
    left:
      kind: bullets
      heading: "What we ask the Board to approve"
      points:
        - "Raise the mobile development budget by 20%"
        - "Extend personalisation to lending products"
        - "Launch a business mobile app in Q2 2026"
        - "Target 3.5M mobile active users by year end"
    right:
      kind: chart
      heading: "Mobile active users"
      chart:
        type: area_line
        data:
          categories: ["Q1 24", "Q2 24", "Q3 24", "Q4 24", "Q1 25", "Q2 25", "Q3 25", "Q4 25"]
          series:
            - name: "Mobile active users"
              values: [2.05, 2.12, 2.2, 2.28, 2.41, 2.55, 2.68, 2.8]
        number_format: "0.0"
        unit: "millions"

  - type: back_cover
