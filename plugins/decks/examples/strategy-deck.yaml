# Strategy deck: a three-year plan argued through a process, options and numbers.
# Exercises: cover, divider, content (with a caption), process, cards (grid, with a
# highlighted card), chart (bar_horizontal), table, image, custom (positioned
# elements including a line chart), back_cover.
# The figures and sources are synthetic, written to show the shape.

presentation:
  title: "Digital Transformation Strategy 2026-2028"
  audience: "Board Strategy Committee"
  purpose: "Three-year digital transformation roadmap"
  main_recommendation: "Invest EUR 120M over three years to lead Greek digital banking"
  language: en

slides:
  - type: cover
    id: S01
    content:
      title: "Digital Transformation Strategy"
      subtitle: "Roadmap 2026-2028"
      location: "Athens"
      date: "February 2026"

  - type: divider
    id: S02
    content:
      number: 1
      title: "Strategic context"

  - type: content
    id: S03
    content:
      title: "Digital channels now decide where customers open their next account"
      bumper: "Situation"
      description: "What changed in the last three years"
      points:
        - "85% of customers prefer digital channels for everyday banking"
        - "Digital-only providers win 15% of new account openings"
        - "A digital transaction costs a tenth of a branch transaction"
        - "Customers compare us with the best apps they use, not with other banks"

  - type: process
    id: S04
    content:
      title: "The plan moves from foundations to scale in four steps"
      bumper: "Roadmap"
    steps:
      - title: "Foundations"
        body: "Cloud platform and data layer in place by mid-2026."
      - title: "Mobile first"
        body: "Every retail product available for mobile origination."
      - title: "Intelligence"
        body: "Personalisation and service automation across channels."
      - title: "Scale"
        body: "Open banking partners and business customers on the platform."

  - type: cards
    id: S05
    layout: grid
    content:
      title: "Four pillars carry the transformation, with mobile as the anchor"
      bumper: "Strategic pillars"
    cards:
      - title: "Mobile first"
        body: "Redesign every customer journey for the phone first."
        highlight: true
      - title: "Intelligence everywhere"
        body: "Use data for personalisation, service and operations."
      - title: "Open banking"
        body: "Build a partner ecosystem through a public API platform."
      - title: "Cloud native"
        body: "Move core systems to the cloud for speed and scale."

  - type: chart
    id: S06
    content:
      title: "Cloud migration takes the largest share of the EUR 120M investment"
      description: "Investment by area, 2026-2028, EUR millions"
      source:
        name: "Planning submission"
        as_of: "31 January 2026"
        basis: "budgeted spend, nominal terms"
    chart:
      type: bar_horizontal
      data:
        categories: ["Cloud migration", "Mobile platform", "Data and intelligence", "Open banking APIs"]
        series:
          - name: "Investment"
            values: [42, 30, 30, 18]

  - type: table
    id: S07
    content:
      title: "Spending peaks in 2026 and falls as the platform matures"
      source:
        name: "Planning submission"
        as_of: "31 January 2026"
        basis: "budgeted spend, nominal terms"
    table:
      headers: ["Investment area", "2026", "2027", "2028", "Total"]
      rows:
        - ["Mobile platform", "EUR 15M", "EUR 10M", "EUR 5M", "EUR 30M"]
        - ["Data and intelligence", "EUR 10M", "EUR 12M", "EUR 8M", "EUR 30M"]
        - ["Open banking APIs", "EUR 8M", "EUR 6M", "EUR 4M", "EUR 18M"]
        - ["Cloud migration", "EUR 15M", "EUR 18M", "EUR 9M", "EUR 42M"]
        - ["Total", "EUR 48M", "EUR 46M", "EUR 26M", "EUR 120M"]
      highlight_column: 4

  - type: image
    id: S08
    content:
      title: "Customers will see growth in their own finances, not only in our app"
      bumper: "Customer view"
    image:
      # An SVG from the illustration library: vector art scales to the slot without
      # blurring, where an 800 px PNG would stop at 5.3 in (150 DPI) and warn.
      path: "illustrations/splash/moneybox.svg"
      alt_text: "Illustration of a money box with a coin dropping in"
      caption: "Illustrative: the personal finance view shows customers their savings growing"

  - type: custom
    id: S09
    content:
      title: "Benefits of EUR 300M over five years justify the investment"
      bumper: "Expected returns"
      source:
        name: "Planning submission"
        as_of: "31 January 2026"
    elements:
      - kind: shape
        shape: rounded_rect
        x: 0.374
        y: 1.3
        w: 3.9
        h: 4.75
        fill: off_white
      - kind: text
        role: kpi_value
        text: "EUR 300M"
        x: 0.574
        y: 1.6
        w: 3.5
        h: 0.9
        align: center
      - kind: text
        role: body
        text: "Five-year benefits: EUR 150M revenue uplift, EUR 100M cost reduction and EUR 50M fraud losses avoided."
        x: 0.574
        y: 2.7
        w: 3.5
        h: 2.2
        align: center
      - kind: chart
        x: 4.6
        y: 1.3
        w: 8.35
        h: 4.75
        chart:
          type: line
          data:
            categories: ["2026", "2027", "2028", "2029", "2030"]
            series:
              - name: "Cumulative benefit"
                values: [20, 70, 140, 220, 300]
              - name: "Cumulative investment"
                values: [48, 94, 120, 120, 120]

  - type: back_cover
