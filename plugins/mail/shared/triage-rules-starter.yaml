# plugins/mail/shared/triage-rules-starter.yaml
# Copy this to ~/.claude/triage/rules.yaml and customize.
rules:
  - name: Calendar invites
    when:
      content_class: "schedule.meeting"
    action: keep

  - name: Internal newsletters
    when:
      sender_contains: "newsletter@"
    action:
      move_to: "Inbox/Newsletters"
